name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time, so two quick pushes can't publish the same release concurrently
concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        run: |
          brew install ldid make xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          # logos 777925d (Jun 2026) drops everything after a bare %orig on the same line; pin the commit before it
          git -C "$HOME/theos/vendor/logos" fetch --depth 5 origin
          git -C "$HOME/theos/vendor/logos" checkout a623700
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks-src"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1

      - name: Package info
        id: package
        run: |
          echo "deb=$(ls -t packages/*.deb | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^Name: //p' control)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^Version: //p' control)" >> "$GITHUB_OUTPUT"

      # Builds of main are published as a release (the plain .deb); other branches and pull requests get an artifact
      - name: Upload artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.deb }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: ${{ steps.package.outputs.deb }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$VERSION"
          notes=$(printf '%s %s for rootless jailbreaks (iphoneos-arm64).\n\nDownload the .deb below and install it with Sileo, Zebra or Filza.\n\nBuilt from %s: %s' \
            "$NAME" "$VERSION" "${GITHUB_SHA::7}" "$(git log -1 --format=%s)")
          # One release per version: every build moves the tag to its commit and replaces the .deb
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$DEB" --clobber
            gh release edit "$tag" --title "$NAME $VERSION" --notes "$notes" --latest
          else
            gh release create "$tag" "$DEB" --title "$NAME $VERSION" --notes "$notes" --latest
          fi
